services:
  - type: web
    name: toolverse
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && pybabel compile -d app/translations
    startCommand: gunicorn run:app
    healthCheckPath: /
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: LOG_LEVEL
        value: INFO
