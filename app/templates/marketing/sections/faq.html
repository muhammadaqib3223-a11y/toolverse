{# FAQ accordion (opened/closed by static/js/faq.js). Expects `faqs`: a list of FAQ(question, answer).
   Without JavaScript every answer stays visible. Also outputs FAQPage structured data for search engines. #}
<section id="faq" class="container-page mt-32 sm:mt-40" data-aos="fade-up">
  <h2 class="heading text-center text-[40px] sm:text-5xl">{{ _('Questions') }}</h2>

  <div class="mx-auto mt-12 max-w-[640px] border-t border-line">
    {% for item in faqs %}
      <div class="faq-item border-b border-line" data-faq-item>
        <h3>
          <button type="button" class="faq-trigger" id="faq-q-{{ loop.index }}"
                  aria-expanded="false" aria-controls="faq-a-{{ loop.index }}" data-faq-trigger>
            <span>{{ item.question }}</span>
            <span class="faq-icon" aria-hidden="true"></span>
          </button>
        </h3>
        <div class="faq-panel" id="faq-a-{{ loop.index }}" role="region" aria-labelledby="faq-q-{{ loop.index }}">
          <div class="faq-panel-inner">
            <p class="pb-5 pe-10 text-start text-[14px] text-muted">{{ item.answer }}</p>
          </div>
        </div>
      </div>
    {% endfor %}
  </div>

  <script type="application/ld+json">{{ faq_schema(faqs) | tojson }}</script>
</section>
