{% from "partials/icons.html" import icon %}

<section id="faq" class="container-page mt-32 sm:mt-40" data-aos="fade-up">
  <h2 class="heading text-center text-[40px] sm:text-5xl">{{ _('Questions') }}</h2>

  <div class="mx-auto mt-12 max-w-[560px] border-t border-line">
    {% for item in faqs %}
      <details class="faq-item group border-b border-line">
        <summary class="flex cursor-pointer list-none items-center justify-between gap-4 py-5 text-start text-[14px] font-medium">
          <span>{{ item.question }}</span>
          <span class="text-muted transition-transform duration-300 group-open:rotate-45">{{ icon("plus", "h-4 w-4") }}</span>
        </summary>
        <p class="faq-answer pb-5 pe-8 text-start text-[13px] text-muted">{{ item.answer }}</p>
      </details>
    {% endfor %}
  </div>
</section>
