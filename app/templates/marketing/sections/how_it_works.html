<section id="get-started" class="container-page mt-32 sm:mt-40">
  <h2 class="heading text-center text-[40px] sm:text-6xl" data-aos="fade-up">{{ _('Start in a minute.') }}</h2>

  <ol class="mt-14 grid border-t border-line sm:grid-cols-3" data-aos="fade-up">
    {% for step in steps %}
      <li class="border-b border-line py-7 text-start sm:border-b-0 sm:pe-8">
        <p class="font-mono text-[11px] text-faint" dir="ltr">{{ step.number }}</p>
        <h3 class="mt-3 text-[17px] font-semibold tracking-tight">{{ step.title }}</h3>
        <p class="mt-1 text-[13px] text-muted">{{ step.description }}</p>
      </li>
    {% endfor %}
  </ol>
</section>
