{# EN / اردو switch. Import with: {% from "partials/language_switch.html" import language_switch with context %} #}
{% macro language_switch() -%}
  <span class="inline-flex items-center gap-1.5" aria-label="{{ _('Language') }}">
    {% for code, name in languages.items() %}
      {% if not loop.first %}<span class="text-faint" aria-hidden="true">/</span>{% endif %}
      <a href="{{ language_urls[code] }}"
         lang="{{ code }}" hreflang="{{ code }}"
         class="lang-link {{ 'text-fg' if code == current_lang else 'text-muted hover:text-fg' }}"
         {% if code == current_lang %}aria-current="true"{% endif %}>{{ 'EN' if code == 'en' else name }}</a>
    {% endfor %}
  </span>
{%- endmacro %}
